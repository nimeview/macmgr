name = "Arthur Rice"
version = "1.0.0"
manifest_version = 1
description = "yabai + skhd + SketchyBar + borders tiling desktop rice"

# My rice mirror (LIVE ↔ selective sync / publish). Not Felix upstream.
[rice]
path = "~/.local/share/macmgr/rice"
git_url = ""
strategy = "copy" # copy | symlink when planting LIVE from rice

[paths]
config_home = "~/.config"
wallpaper_dir = "~/Wallpaper"
backup_dir = "~/.local/share/macmgr/backups"
ensure_spaces = "~/bin/ensure_spaces.sh"

[[taps]]
name = "FelixKratz/formulae"

[[taps]]
name = "koekeishiya/formulae"

[[services]]
id = "yabai"
brew = "yabai"
label = "com.asmvik.yabai"
core = true
control = "native"

[[services]]
id = "skhd"
brew = "skhd"
label = "com.koekeishiya.skhd"
core = true
control = "native"

[[services]]
id = "sketchybar"
brew = "sketchybar"
label = "homebrew.mxcl.sketchybar"
core = true
control = "brew"

[[services]]
id = "borders"
brew = "borders"
label = "homebrew.mxcl.borders"
core = true
control = "brew"

[[services]]
id = "svim"
brew = "svim"
label = "homebrew.mxcl.svim"
core = false
control = "brew"

[[packages]]
name = "yabai"
kind = "formula"
group = "core"
core = true

[[packages]]
name = "skhd"
kind = "formula"
group = "core"
core = true

[[packages]]
name = "sketchybar"
kind = "formula"
