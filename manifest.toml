[[configs]]
id = "yabai"
label = "yabai"
path = "~/.config/yabai/yabairc"
repo_path = "~/.local/share/macmgr/rice/.config/yabai/yabairc"
kind = "file"
managed = true

[[configs]]
id = "skhd"
label = "skhd"
path = "~/.config/skhd/skhdrc"
repo_path = "~/.local/share/macmgr/rice/.config/skhd/skhdrc"
kind = "file"
managed = true

[[configs]]
id = "sketchybar"
label = "SketchyBar (live)"
path = "~/.config/sketchybar"
repo_path = "~/.local/share/macmgr/rice/.config/sketchybar"
kind = "dir"
managed = true

[[configs]]
id = "borders"
label = "borders"
path = "~/.config/borders/bordersrc"
repo_path = "~/.local/share/macmgr/rice/.config/borders/bordersrc"
kind = "file"
managed = true

[[configs]]
id = "kitty"
label = "kitty"
path = "~/.config/kitty"
repo_path = "~/.local/share/macmgr/rice/.config/kitty"
kind = "dir"
managed = true

[[configs]]
id = "helix"
label = "helix"
path = "~/.config/helix"
repo_path = "~/.local/share/macmgr/rice/.config/helix"
kind = "dir"
managed = true

[[configs]]
id = "starship"
label = "starship"
path = "~/.config/starship.toml"
repo_path = "~/.local/share/macmgr/rice/.config/starship.toml"
kind = "file"
managed = true

[[configs]]
id = "zsh"
label = "zshrc"
path = "~/.zshrc"
repo_path = "~/.local/share/macmgr/rice/.zshrc"
kind = "file"
managed = true

[[configs]]
id = "tmux"
label = "tmux"
path = "~/.tmux.conf"
repo_path = "~/.local/share/macmgr/rice/.tmux.conf"
kind = "file"
managed = true

[[defaults]]
id = "dock-autohide"
domain = "com.apple.dock"
key = "autohide"
value = "true"
type = "bool"
core = true

[[defaults]]
id = "hide-menubar"
domain = "NSGlobalDomain"
key = "_HIHideMenuBar"
value = "true"
type = "bool"
core = true

[[defaults]]
id = "show-extensions"
domain = "NSGlobalDomain"
key = "AppleShowAllExtensions"
value = "true"
type = "bool"
core = true

[[defaults]]
id = "key-repeat"
domain = "NSGlobalDomain"
key = "KeyRepeat"
value = "1"
type = "int"
core = true

[[defaults]]
id = "disable-window-anim"
domain = "NSGlobalDomain"
key = "NSAutomaticWindowAnimationsEnabled"
value = "false"
type = "bool"
core = true

[[defaults]]
id = "finder-show-all"
domain = "com.apple.Finder"
key = "AppleShowAllFiles"
value = "true"
type = "bool"
core = true

[[presets]]
id = "compact"
label = "Compact"
padding = 4
gap = 6
opacity = 0.85

[[presets]]
id = "comfortable"
label = "Comfortable"
padding = 8
gap = 10
opacity = 0.80

[[presets]]
id = "spacious"
label = "Spacious"
padding = 16
gap = 16
opacity = 0.90

[[post_install]]
id = "sbarlua"
label = "Install SbarLua"
command = "curl -L https://raw.githubusercontent.com/FelixKratz/SbarLua/main/install.sh | sh"

[[post_install]]
id = "sketchybar_font"
label = "Install sketchybar-app-font"
command = "curl -L https://github.com/kvndrsslr/sketchybar-app-font/releases/download/v2.0.28/sketchybar-app-font.ttf -o \"$HOME/Library/Fonts/sketchybar-app-font.ttf\""

[[post_install]]
id = "ensure_spaces"
label = "Ensure yabai spaces"
command = "test -x \"$HOME/bin/ensure_spaces.sh\" && \"$HOME/bin/ensure_spaces.sh\" || true"
